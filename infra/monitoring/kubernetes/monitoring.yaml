# ------------------------------------------------
#                     ADMINER
# ------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
        - name: adminer
          image: adminer
          resources:
            limits:
              memory: "1Gi"
              cpu: "300m"
            requests:
              memory: "1Gi"
              cpu: "250m"
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: mysql
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: adminer-service
spec:
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30003
  selector:
    app: adminer
  type: NodePort
---
# ------------------------------------------------
#                     ADMINER
# ------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:latest
          resources:
            limits:
              memory: "1Gi"
              cpu: "300m"
            requests:
              memory: "1Gi"
              cpu: "250m"
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki/
      volumes:
        - name: loki-config
          hostPath:
            path: ./monitoring/grafana/loki-config.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          resources:
            limits:
              memory: "1Gi"
              cpu: "300m"
            requests:
              memory: "1Gi"
              cpu: "250m"
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:latest
          resources:
            limits:
              memory: "1Gi"
              cpu: "300m"
            requests:
              memory: "1Gi"
              cpu: "250m"
          ports:
            - containerPort: 16686
            - containerPort: 14268
            - containerPort: 14250
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          resources:
            limits:
              memory: "1Gi"
              cpu: "300m"
            requests:
              memory: "1Gi"
              cpu: "250m"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/
      volumes:
        - name: prometheus-config
          hostPath:
            path: ./monitoring/prometheus/prometheus.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
spec:
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: prometheus

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:latest
          resources:
            limits:
              memory: "1Gi"
              cpu: "300m"
            requests:
              memory: "1Gi"
              cpu: "250m"
          args: ["--config=/etc/otel-collector-config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel-collector/
      volumes:
        - name: otel-config
          hostPath:
            path: ./monitoring/telementry/otel-collector-config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-service
spec:
  ports:
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 4318
      targetPort: 4318
  selector:
    app: otel-collector
